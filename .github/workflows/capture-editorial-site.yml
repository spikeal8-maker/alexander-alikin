name: Capture editorial site review

on:
  push:
    branches:
      - agent/recover-visible-site

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[skip editorial capture]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recover-visible-site
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start site
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/alikin-astro.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4321/alexander-alikin/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/alikin-astro.log
          exit 1
      - name: Capture review set
        run: |
          mkdir -p docs/screenshots/editorial-site-v4
          node --input-type=module <<'EOF'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const base = 'http://127.0.0.1:4321/alexander-alikin';
          const captures = [
            ['home-desktop', '/', 1440, 900],
            ['home-mobile', '/', 390, 844],
            ['projects-desktop', '/projects/', 1440, 900],
            ['projects-mobile', '/projects/', 390, 844],
            ['business-desktop', '/business/', 1440, 900],
            ['education-desktop', '/education/', 1440, 900],
            ['journal-desktop', '/journal/', 1440, 900],
            ['about-desktop', '/about/', 1440, 900],
            ['contacts-mobile', '/contacts/', 390, 844],
          ];
          for (const [name, route, width, height] of captures) {
            await page.setViewportSize({ width, height });
            await page.goto(`${base}${route}`, { waitUntil: 'networkidle' });
            await page.screenshot({ path: `docs/screenshots/editorial-site-v4/${name}.png`, fullPage: true });
          }
          await browser.close();
          EOF
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/editorial-site-v4
          if git diff --cached --quiet; then
            echo "No screenshot changes"
          else
            git commit -m "docs: capture editorial site review [skip editorial capture]"
            git push origin HEAD:agent/recover-visible-site
          fi