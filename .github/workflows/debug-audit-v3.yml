name: Debug V3 Audit

on:
  pull_request:
    branches:
      - agent/integrate-visual-direction-v2-1

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture audit report
        shell: bash
        run: |
          npm audit --json > audit.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: v3-audit-diagnostics
          path: audit.json
          retention-days: 1
