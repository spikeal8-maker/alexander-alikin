name: Editorial browser QA

on:
  push:
    branches:
      - agent/recover-visible-site

permissions:
  contents: write

jobs:
  browser:
    if: ${{ !contains(github.event.head_commit.message, '[skip browser qa]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recover-visible-site
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start site
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/alikin-astro.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4321/alexander-alikin/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/alikin-astro.log
          exit 1
      - run: npm run design:browser
      - name: Record successful browser gate
        run: |
          mkdir -p docs/testing
          cat > docs/testing/EDITORIAL_SITE_V4_BROWSER_PASS.md <<'EOF'
          # Editorial site V4 browser gate

          Status: PASS

          - 25 routes × 5 viewports;
          - dedicated 404 checks;
          - horizontal overflow diagnostics;
          - broken image checks;
          - no-JS routes;
          - keyboard focus;
          - 200% zoom and text size;
          - Axe serious/critical scan.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testing/EDITORIAL_SITE_V4_BROWSER_PASS.md
          git commit -m "test: record editorial browser gate [skip browser qa]"
          git push origin HEAD:agent/recover-visible-site