name: Prepare ESLint V3 Lockfile

on:
  pull_request:
    branches:
      - agent/integrate-visual-direction-v2-1

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare lint toolchain
        shell: bash
        run: |
          set -o pipefail
          npm install --save-dev eslint@10.8.0 @eslint/js@10.0.1 typescript-eslint@8.65.0 eslint-plugin-astro@3.0.1 2>&1 | tee upgrade.log
      - name: Capture lint result
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Capture audit result
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --json | tee audit.json
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: eslint-v3-lockfile
          path: |
            package.json
            package-lock.json
            upgrade.log
            lint.log
            audit.json
          retention-days: 1
      - name: Preserve verification result
        if: steps.lint.outputs.status != '0' || steps.audit.outputs.status != '0'
        run: exit 1
