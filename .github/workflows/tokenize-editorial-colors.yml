name: Tokenise editorial colors

on:
  push:
    branches:
      - agent/recover-visible-site

permissions:
  contents: write

jobs:
  tokenise:
    if: ${{ !contains(github.event.head_commit.message, '[skip color tokenise]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recover-visible-site
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Replace remaining raw colors
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          const files = fs.readdirSync('src/styles')
            .filter((name) => name.startsWith('gates-') && name.endsWith('.css'))
            .map((name) => path.join('src/styles', name));
          files.push('src/layouts/BaseLayoutV3.astro');
          const replacements = new Map([
            ['#fff', 'var(--gn-white)'],
            ['#111', 'var(--gn-black)'],
            ['#f5f3ec', 'var(--gn-product-surface)'],
            ['#d6e2ff', 'var(--gn-product-canvas-blue)'],
            ['#f3e2bd', 'var(--gn-product-canvas-sand)'],
            ['#dce8ff', 'var(--gn-project-visual)'],
          ]);
          for (const file of files) {
            let content = fs.readFileSync(file, 'utf8');
            for (const [source, target] of replacements) content = content.split(source).join(target);
            fs.writeFileSync(file, content);
          }
          EOF
      - run: npm run format:write
      - name: Commit token cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No token changes"
          else
            git commit -m "style: finish editorial color tokens [skip color tokenise]"
            git push origin HEAD:agent/recover-visible-site
          fi