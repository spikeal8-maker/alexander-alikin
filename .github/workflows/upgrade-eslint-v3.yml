name: Upgrade ESLint V3

on:
  push:
    branches:
      - agent/editorial-visual-restart-v3

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/editorial-visual-restart-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Upgrade lint toolchain
        run: >-
          npm install --save-dev
          eslint@10.8.0
          @eslint/js@10.0.1
          typescript-eslint@8.65.0
          eslint-plugin-astro@3.0.1
      - run: npm run lint
      - run: npm audit --audit-level=high
      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: upgrade ESLint toolchain for security" || exit 0
          git push origin HEAD:agent/editorial-visual-restart-v3
